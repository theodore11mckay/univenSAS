{% extends "base.html" %}
{% block title %}Login | UNIVEN Accommodation{% endblock %}
{% block content %}
<section class="form-shell">
  <div class="eyebrow">SECURE ACCESS</div><h1>Login</h1><p>Students use their registered email and PIN. </p>
  <form method="post" class="form-card">
    <label>Email<input name="email" type="email" required></label>
    <label>PIN<input name="pin" type="password" minlength="4" required></label>
    <button class="button" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
